services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lab02
      POSTGRES_USER: lab02
      POSTGRES_PASSWORD: lab02
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
