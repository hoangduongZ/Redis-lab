spring:
  application:
    name: redis-lab-prj
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:redis_lab}
    username: ${DB_USER:redis_lab}
    password: ${DB_PASSWORD:redis_lab}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
