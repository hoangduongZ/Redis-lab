services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: redis_lab
      POSTGRES_USER: redis_lab
      POSTGRES_PASSWORD: redis_lab
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redis_lab -d redis_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: redis_lab
      DB_USER: redis_lab
      DB_PASSWORD: redis_lab
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
